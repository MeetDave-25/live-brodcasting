# MediaMTX (streaming engine) config. Unlisted settings use MediaMTX defaults.
# Passwords are NOT here: the app server (serve.js) checks them and is the only
# thing allowed to publish. All MediaMTX ports except 8189 are bound to 127.0.0.1.
logLevel: info

authMethod: internal
authInternalUsers:
  # Anyone can watch (HLS comes in through Caddy / serve.js)
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
  # The app server on this machine: go live, recordings, stats
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
      - action: playback
      - action: api
      - action: metrics

api: true
apiAddress: 127.0.0.1:9997

# Recordings download service (used by the admin panel)
playback: true
playbackAddress: 127.0.0.1:9996

# RTSP only inside this machine: FFmpeg reads the main angle from here to send it to
# YouTube / Facebook / Instagram ("Go live everywhere" in the control room)
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]

# Not needed: phones publish over WebRTC, viewers watch over HLS
rtmp: false
srt: false
moq: false

# Viewers: standard HLS (about 6-8 s delay). Works on every iPhone/Android and scales well.
# (lowLatency mode errors on iPhones with phone-camera input.)
hls: true
hlsAddress: 127.0.0.1:8888
hlsVariant: fmp4
hlsSegmentCount: 7
hlsSegmentDuration: 2s
hlsAlwaysRemux: true

# Phones: WebRTC (WHIP). Signalling comes through serve.js; the video itself flows
# directly over port 8189 (UDP, TCP as backup). Open both on the server firewall.
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
# The install script writes the server's public IP here.
webrtcAdditionalHosts: []

paths:
  # Camera angles cam1 ... cam6, each recorded to server/recordings/<angle>/
  "~^cam[1-6]$":
    record: true
    recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    recordSegmentDuration: 1h
    # Keep recordings until you delete them
    recordDeleteAfter: 0s

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>RANGVAASA · Camera</title>
  <meta name="theme-color" content="#0b0907">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400..700&family=Baloo+Bhai+2:wght@600..800&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="studio.css">
  <script src="server-info.js"></script>
  <script src="config.js"></script>
  <script src="studio.js" defer></script>
</head>
<body class="studio">
  <div class="cam">
    <video id="preview" playsinline muted autoplay></video>

    <div class="cam-top">
      <button class="chip" id="angleChip" aria-label="Change angle">
        <span class="chip-k">Angle</span>
        <span id="angleLabel">–</span>
      </button>
      <span class="rec" id="rec" hidden><i></i><span id="timer">00:00</span></span>
      <button class="round small" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>

    <div class="cam-mid">
      <p class="cam-msg" id="msg"></p>
      <p class="rotate" id="rotateHint" hidden>Turn the phone sideways for a wide picture</p>
    </div>

    <div class="cam-bottom">
      <p class="cam-stats" id="stats" hidden></p>
      <div class="cam-controls">
        <button class="round" id="micBtn" aria-label="Mute microphone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/><path class="slash" d="M4 4l16 16" hidden/></svg>
        </button>
        <button class="shutter" id="goBtn" aria-label="Go live"><span></span></button>
        <button class="round" id="flipBtn" aria-label="Switch camera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5Z"/><path d="M9.2 11.2a3 3 0 0 1 5.3-.9m.3 2.5a3 3 0 0 1-5.3.9"/><path d="M14.8 8.8v1.8H13M9.2 15.2v-1.8H11"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Setup sheet -->
  <div class="sheet" id="sheet">
    <form class="sheet-card" id="setupForm">
      <p class="eyebrow"><span data-cfg="name">RANGVAASA</span> · Camera</p>
      <h1>Set up <em>this phone</em></h1>

      <label class="field">
        <span>Camera password</span>
        <input id="pass" type="password" autocomplete="current-password" placeholder="From the organisers" required>
      </label>

      <fieldset class="field">
        <legend>Which angle is this phone?</legend>
        <div class="choices" id="angleChoices"></div>
      </fieldset>

      <fieldset class="field">
        <legend>Picture quality</legend>
        <div class="choices two" id="qualityChoices">
          <label class="choice"><input type="radio" name="quality" value="sd" checked><span><b>Standard</b><small>480p · sharp, best for 400 viewers</small></span></label>
          <label class="choice"><input type="radio" name="quality" value="hd"><span><b>HD</b><small>720p · sharpest, fewer viewers</small></span></label>
          <label class="choice"><input type="radio" name="quality" value="low"><span><b>Saver</b><small>360p · weak network</small></span></label>
        </div>
      </fieldset>

      <p class="sheet-err" id="sheetErr"></p>
      <button class="btn" type="submit" id="saveBtn">Ready</button>
    </form>
  </div>
</body>
</html>

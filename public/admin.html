<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>RANGVAASA · Control room</title>
  <meta name="theme-color" content="#0d0a1a">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400..700&family=Baloo+Bhai+2:wght@600..800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" defer></script>
  <script src="admin.js" defer></script>
</head>
<body class="admin">
  <div class="ambient" aria-hidden="true"></div>
  <header class="bar">
    <a class="mark" href="/admin">
      <img class="logo" src="icon.svg" alt="">
      <span class="mark-text">
        <span class="mark-name"><span data-cfg="name">RANGVAASA</span><b data-cfg="year">2026</b></span>
        <span class="mark-sub">Control room</span>
      </span>
    </a>
    <div class="bar-right">
      <button class="pill" id="logoutBtn" hidden>Log out</button>
      <button class="round-btn" id="themeBtn" aria-label="Switch theme"></button>
    </div>
  </header>

  <main class="admin-main">
    <!-- Login -->
    <form class="login" id="login" hidden>
      <p class="eyebrow">Organisers only</p>
      <h1>Control <em>room</em></h1>
      <label class="field">
        <span>Admin password</span>
        <input id="adminPass" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-err" id="loginErr"></p>
      <button class="btn" type="submit">Enter</button>
    </form>

    <!-- Dashboard -->
    <div id="dash" hidden>
      <section class="summary">
        <div><p class="eyebrow">Watching now</p><p class="big" id="sumWatching">0</p></div>
        <div><p class="eyebrow">Angles live</p><p class="big" id="sumLive">0</p></div>
        <div><p class="eyebrow">Main angle</p><p class="big serif-sm" id="sumMain">–</p></div>
      </section>

      <section class="block">
        <div class="block-head">
          <h2 class="block-title">Angles</h2>
          <p class="eyebrow">Previews are muted</p>
        </div>
        <div class="angle-grid" id="angleGrid"></div>
      </section>

      <section class="block">
        <div class="block-head"><h2 class="block-title">Announcement</h2></div>
        <form class="announce" id="announceForm">
          <textarea id="announceText" maxlength="280" rows="3" placeholder="e.g. Awards begin in 10 minutes. Stay with us."></textarea>
          <div class="announce-row">
            <span class="fine" id="announceCount">0 / 280</span>
            <span class="spacer"></span>
            <button class="btn btn-quiet" type="button" id="clearAnnounce">Clear</button>
            <button class="btn" type="submit">Post to viewers</button>
          </div>
        </form>
      </section>

      <section class="block">
        <div class="block-head">
          <h2 class="block-title">Recordings</h2>
          <p class="eyebrow">Every angle is recorded</p>
        </div>
        <div id="recordings"></div>
      </section>

      <section class="block">
        <div class="block-head"><h2 class="block-title">Links</h2></div>
        <div class="links">
          <div class="qr-card">
            <canvas id="qr" width="240" height="240" aria-label="QR code for the viewer link"></canvas>
            <button class="btn btn-quiet" id="qrDownload">Download QR for posters</button>
          </div>
          <dl class="details link-list">
            <div><dt>Viewers</dt><dd><code id="viewerLink"></code> <button class="copy" data-copy="viewerLink">Copy</button></dd></div>
            <div><dt>Cameras</dt><dd><code id="studioLink"></code> <button class="copy" data-copy="studioLink">Copy</button></dd></div>
          </dl>
        </div>
      </section>
    </div>
  </main>

  <button class="toast" id="toast" type="button"></button>
</body>
</html>
